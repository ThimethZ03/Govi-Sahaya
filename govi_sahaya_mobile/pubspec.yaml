name: govi_sahaya
description: Smart Agriculture Advisor & Community Platform for Sri Lankan Farmers
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ... your existing dependencies ...

  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  provider: ^6.1.1

  #NOTIFICATIONS
  timeago: ^3.6.1

  share_plus: ^7.2.1

  google_maps_flutter: ^2.9.0
  flutter_polyline_points: ^2.1.0
  permission_handler: ^11.3.1

  # ✅ Internet / Network
  connectivity_plus: ^6.0.5
  internet_connection_checker: ^1.0.0+1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  google_sign_in: ^6.1.6
  firebase_app_check: ^0.2.2

  # Utilities
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  http: ^1.2.0
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  url_launcher: ^6.2.3
  google_fonts: ^6.1.0
  animate_do: ^3.3.4
  shimmer: ^3.0.0
  lottie: ^3.0.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
